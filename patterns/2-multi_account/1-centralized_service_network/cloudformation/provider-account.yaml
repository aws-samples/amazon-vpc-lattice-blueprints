AWSTemplateFormatVersion: 2010-09-09
Description: Provider account - VPC Lattice service (Lambda) and Aurora resource configuration, both shared via RAM
Transform: 'AWS::LanguageExtensions'

Mappings:
  SubnetToIndex:
    RGWa:
      Index: 0
    RGWb:
      Index: 1
    Databasea:
      Index: 2
    Databaseb:
      Index: 3

Resources:
  # ---------- VPC LATTICE SERVICE (LAMBDA TARGET) ----------
  VpcLatticeService:
    Type: AWS::VpcLattice::Service
    Properties:
      Name: !Sub service-${AWS::StackName}
      AuthType: AWS_IAM

  # Open (allow-all) auth policy.
  VpcLatticeServiceAuthPolicy:
    Type: AWS::VpcLattice::AuthPolicy
    Properties:
      ResourceIdentifier: !Ref VpcLatticeService
      Policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "*"
            Principal: "*"
            Resource: "*"

  VpcLatticeServiceHTTPSListener:
    Type: AWS::VpcLattice::Listener
    Properties:
      Name: https-service-listener
      ServiceIdentifier: !Ref VpcLatticeService
      Port: 443
      Protocol: HTTPS
      DefaultAction:
        Forward:
          TargetGroups:
            - TargetGroupIdentifier: !Ref VpcLatticeTargetGroup
              Weight: 100

  VpcLatticeTargetGroup:
    Type: AWS::VpcLattice::TargetGroup
    Properties:
      Name: target-lambda
      Type: LAMBDA
      Config:
        LambdaEventStructureVersion: V2
      Targets:
        - Id: !GetAtt LambdaFunction.Arn

  # ---------- RAM SHARE (AWS ORGANIZATION) ----------
  # A single share carries BOTH the VPC Lattice service and the Aurora resource configuration.
  RAMShare:
    Type: AWS::RAM::ResourceShare
    Properties:
      AllowExternalPrincipals: false
      Name: provider-resource-share
      Principals:
        - !GetAtt GetOrganizationId.OrganizationArn
      ResourceArns:
        - !GetAtt VpcLatticeService.Arn
        - !GetAtt ResourceConfiguration.Arn

  # ---------- LAMBDA FUNCTION (SERVICE TARGET) ----------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lambda-vpc-lattice-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lambda-vpclattice-target
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.14
      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):
              response_body = {
                  'message': 'Hello from Lambda Function!!',
              }

              return {
                  'statusCode': 200,
                  'headers': {
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps(response_body)
              }

  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: vpc-lattice.amazonaws.com
      SourceArn: !GetAtt VpcLatticeTargetGroup.Arn

  # ---------- PROVIDER VPC (RESOURCE GATEWAY + AURORA) ----------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub provider-vpc-${AWS::StackName}

  Ipv6Cidr:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      AmazonProvidedIpv6CidrBlock: true
      VpcId: !Ref VPC

  # For::Each iteration: per subnet type (RGW, Database) and AZ (2 AZs)
  'Fn::ForEach::SubnetTypes':
    - SubnetType
    - [RGW, Database]
    - '${SubnetType}':
      'Fn::ForEach::AZ':
        - AvailabilityZone
        - [a, b]
        - '${SubnetType}Subnet${AvailabilityZone}':
            DependsOn:
              - Ipv6Cidr
            Type: AWS::EC2::Subnet
            Properties:
              VpcId: !Ref VPC
              AvailabilityZone: !Sub ${AWS::Region}${AvailabilityZone}
              CidrBlock: !Select
                - !FindInMap [SubnetToIndex, !Sub "${SubnetType}${AvailabilityZone}", Index]
                - !Cidr
                  - !GetAtt VPC.CidrBlock
                  - 256
                  - 8
              Ipv6CidrBlock: !Select
                - !FindInMap [SubnetToIndex, !Sub "${SubnetType}${AvailabilityZone}", Index]
                - !Cidr
                  - !Select [0, !GetAtt VPC.Ipv6CidrBlocks]
                  - 256
                  - 64
              AssignIpv6AddressOnCreation: true
              Tags:
                - Key: Name
                  Value: !Sub provider-subnet-${SubnetType}-AZ${AvailabilityZone}-${AWS::StackName}
          '${SubnetType}RouteTable${AvailabilityZone}':
            Type: AWS::EC2::RouteTable
            Properties:
              VpcId: !Ref VPC
              Tags:
                - Key: Name
                  Value: !Sub provider-rt-${SubnetType}-AZ${AvailabilityZone}-${AWS::StackName}
          '${SubnetType}RouteTableAssociation${AvailabilityZone}':
            Type: AWS::EC2::SubnetRouteTableAssociation
            Properties:
              RouteTableId: !Ref
                'Fn::Sub': '${SubnetType}RouteTable${AvailabilityZone}'
              SubnetId: !Ref
                'Fn::Sub': '${SubnetType}Subnet${AvailabilityZone}'

  # ---------- SECURITY GROUPS ----------
  ResourceGatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Resource Gateway Security Group
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub provider-vpc-resource-gateway-security-group-${AWS::StackName}

  ResourceGatewaySecurityGroupEgressDBIPv4:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ResourceGatewaySecurityGroup
      Description: Allowing MySQL egress to the provider VPC (IPv4)
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      CidrIp: 10.0.0.0/16

  ResourceGatewaySecurityGroupEgressDBIPv6:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ResourceGatewaySecurityGroup
      Description: Allowing MySQL egress to the provider VPC (IPv6)
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      CidrIpv6: !Select [0, !GetAtt VPC.Ipv6CidrBlocks]

  AuroraSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora cluster Security Group
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub provider-vpc-aurora-security-group-${AWS::StackName}

  AuroraSecurityGroupIngressResourceGateway:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AuroraSecurityGroup
      Description: Allowing MySQL ingress from the resource gateway
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref ResourceGatewaySecurityGroup

  AuroraSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AuroraSecurityGroup
      Description: Allowing egress traffic (IPv4)
      IpProtocol: -1
      CidrIp: 0.0.0.0/0

  AuroraSecurityGroupEgressIPv6:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AuroraSecurityGroup
      Description: Allowing egress traffic (IPv6)
      IpProtocol: -1
      CidrIpv6: ::/0

  # ---------- RESOURCE GATEWAY + RESOURCE CONFIGURATION ----------
  ResourceGateway:
    Type: AWS::VpcLattice::ResourceGateway
    Properties:
      Name: resource-gateway-centralized
      IpAddressType: DUALSTACK
      SecurityGroupIds:
        - !Ref ResourceGatewaySecurityGroup
      SubnetIds:
        - !Ref RGWSubneta
        - !Ref RGWSubnetb
      VpcIdentifier: !Ref VPC

  ResourceConfiguration:
    Type: AWS::VpcLattice::ResourceConfiguration
    Properties:
      Name: resource-config-centralized
      ResourceConfigurationType: ARN
      ResourceGatewayId: !Ref ResourceGateway
      ResourceConfigurationDefinition:
        ArnResource: !GetAtt AuroraCluster.DBClusterArn

  # ---------- AURORA CLUSTER ----------
  AuroraSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Aurora subnet group ${AWS::StackName}
      SubnetIds:
        - !Ref DatabaseSubneta
        - !Ref DatabaseSubnetb

  # Credentials are managed by RDS in AWS Secrets Manager, encrypted with the customer-managed key below so the secret can be shared cross-account.
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: aurora-mysql
      EngineVersion: 8.0.mysql_aurora.3.12.0
      DatabaseName: mydb
      MasterUsername: admin
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !Ref AuroraSecretKey
      DBSubnetGroupName: !Ref AuroraSubnetGroup
      StorageEncrypted: true
      VpcSecurityGroupIds:
        - !Ref AuroraSecurityGroup

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.t3.medium
      Engine: aurora-mysql

  # ---------- AURORA SECRET: CROSS-ACCOUNT SHARING ----------
  # Customer-managed KMS key for the RDS-managed secret (the default aws/secretsmanager key cannot be shared cross-account). Decryption is allowed to any principal in the Organization.
  AuroraSecretKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub Encrypts the Aurora master secret for ${AWS::StackName} (shared org-wide)
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRoot
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowOrganizationDecrypt
            Effect: Allow
            Principal: "*"
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalOrgID: !GetAtt GetOrganizationId.OrganizationId

  # Resource policy on the RDS-managed secret: allow the Organization to read it.
  AuroraSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOrganizationRead
            Effect: Allow
            Principal: "*"
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalOrgID: !GetAtt GetOrganizationId.OrganizationId

  # ---------- CUSTOM RESOURCE: GET ORGANIZATION ID ----------
  GetOrganizationId:
    Type: Custom::GetOrganizationId
    Properties:
      ServiceToken: !GetAtt GetOrgIdFunction.Arn

  GetOrgIdFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub get-org-id-${AWS::StackName}
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt GetOrgIdRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  org_client = boto3.client('organizations')
                  response = org_client.describe_organization()
                  org_id = response['Organization']['Id']
                  org_arn = response['Organization']['Arn']

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'OrganizationId': org_id,
                      'OrganizationArn': org_arn
                  })
              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  GetOrgIdRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OrganizationsReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                Resource: '*'

Outputs:
  ServiceDomainName:
    Description: VPC Lattice service domain name (curl this from a consumer instance).
    Value: !GetAtt VpcLatticeService.DnsEntry.DomainName

  AuroraEndpoint:
    Description: Aurora cluster writer endpoint (resolves to a VPC Lattice-managed address from the consumer VPC).
    Value: !GetAtt AuroraCluster.Endpoint.Address

  AuroraSecretArn:
    Description: ARN of the RDS-managed Aurora master secret, shared org-wide for the consumer to read.
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
