AWSTemplateFormatVersion: 2010-09-09
Description: Central AWS Networking services - VPC Lattice service network

Resources:
  # ---------- VPC LATTICE SERVICE NETWORK ----------
  VpcLatticeServiceNetwork:
    Type: AWS::VpcLattice::ServiceNetwork
    Properties:
      AuthType: AWS_IAM
      Name: service-network

  # Open (allow-all) auth policy.
  VpcLatticeServiceNetworkAuthPolicy:
    Type: AWS::VpcLattice::AuthPolicy
    Properties:
      ResourceIdentifier: !Ref VpcLatticeServiceNetwork
      Policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "*"
            Principal: "*"
            Resource: "*"

  # ---------- VPC LATTICE ACCESS LOGGING ----------
  # CloudWatch Logs log group (access logs destination)
  VpcLatticeAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vpclattice/${AWS::StackName}'
      RetentionInDays: 7

  # Access log subscription (service network scope - covers all associated services)
  VpcLatticeAccessLogSubscription:
    Type: AWS::VpcLattice::AccessLogSubscription
    Properties:
      ResourceIdentifier: !Ref VpcLatticeServiceNetwork
      DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${VpcLatticeAccessLogs}'

Outputs:
  VpcLatticeServiceNetworkId:
    Value: !Ref VpcLatticeServiceNetwork
    Description: VPC Lattice service network ID
