#
# Sample application: a 2-replica Flask Deployment + ClusterIP Service, pinned to arm64 (Graviton) nodes
#
# {{APP_IMAGE}} is replaced at apply time with the pattern's ECR image.
apiVersion: v1
kind: Namespace
metadata:
  name: vpc-lattice-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: vpc-lattice-demo
  labels:
    app: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: sample-app
          image: "{{APP_IMAGE}}"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: vpc-lattice-demo
spec:
  type: ClusterIP
  selector:
    app: sample-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
