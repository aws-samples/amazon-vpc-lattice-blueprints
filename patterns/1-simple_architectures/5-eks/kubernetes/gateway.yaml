#
# Gateway API resources the AWS Gateway API Controller reconciles into VPC Lattice:
#   - GatewayClass -> enables the controller
#   - Gateway      -> binds to the EXISTING (Terraform-created) VPC Lattice service network; its name MUST equal that service network's name
#   - HTTPRoute    -> a VPC Lattice service (backed by the sample-app Service/pods, which become a VPC Lattice IP target group)
#
# {{SERVICE_NETWORK_NAME}} is replaced at apply time with the Terraform-created VPC Lattice service network name (service-network-<identifier>).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: amazon-vpc-lattice
spec:
  controllerName: application-networking.k8s.aws/gateway-api-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: "{{SERVICE_NETWORK_NAME}}"
  namespace: vpc-lattice-demo
spec:
  gatewayClassName: amazon-vpc-lattice
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample-service
  namespace: vpc-lattice-demo
spec:
  parentRefs:
    - name: "{{SERVICE_NETWORK_NAME}}"
      sectionName: https
  rules:
    - backendRefs:
        - name: sample-app
          kind: Service
          port: 80
