AWSTemplateFormatVersion: 2010-09-09
Description: Central items - the 'agents' and 'backends' VPC Lattice service networks (AWS_IAM) with access logging, the central AWS service endpoints (endpoints VPC, interface VPC endpoints, resource gateway and one single resource configuration per endpoint, associated with the networks that use them), and the gateway VPC
Transform: 'AWS::LanguageExtensions'

Parameters:
  Identifier:
    Type: String
    Description: Short pattern identifier for VPC Lattice resource names (VPC Lattice caps several names at 40 characters)
    Default: agentic-gateway

Mappings:
  NetworkNames:
    Agents:
      Name: agents
    Backends:
      Name: backends
  SubnetToIndex:
    RGWa:
      Index: 0
    RGWb:
      Index: 1
    Endpointsa:
      Index: 2
    Endpointsb:
      Index: 3
  AzToIndex:
    a:
      Index: 0
    b:
      Index: 1
  # Centralized endpoints: interface endpoint service suffix and the DNS name the consumers use (<prefix>.<region>.<suffix>)
  # ecr.dkr is defined separately, as its DNS name contains the account ID.
  Endpoints:
    bedrock:
      Service: bedrock-runtime
      Prefix: bedrock-runtime
      Suffix: amazonaws.com
    registry:
      Service: agent-registry
      Prefix: agent-registry
      Suffix: api.aws
    ecrapi:
      Service: ecr.api
      Prefix: api.ecr
      Suffix: amazonaws.com
    logs:
      Service: logs
      Prefix: logs
      Suffix: amazonaws.com
    sts:
      Service: sts
      Prefix: sts
      Suffix: amazonaws.com
    secrets:
      Service: secretsmanager
      Prefix: secretsmanager
      Suffix: amazonaws.com
    ssmmsgs:
      Service: ssmmessages
      Prefix: ssmmessages
      Suffix: amazonaws.com

Resources:
  # ========== VPC LATTICE SERVICE NETWORKS ==========
  # Two service networks with the gateway as the only bridge:
  # - 'agents': the agents (and the triage agent, for its model calls) reach the ai-gateway service. Nothing else.
  # - 'backends': the gateway reaches the MCP server, the REST API, the triage agent and the model.
  AgentsServiceNetwork:
    Type: AWS::VpcLattice::ServiceNetwork
    Properties:
      Name: !Sub service-network-agents-${Identifier}
      AuthType: AWS_IAM

  # Only authenticated (SigV4-signed) requests. The ai-gateway service then decides which roles may call it
  # (gateway.yaml)
  AgentsServiceNetworkAuthPolicy:
    Type: AWS::VpcLattice::AuthPolicy
    Properties:
      ResourceIdentifier: !Ref AgentsServiceNetwork
      Policy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAnyAuthenticatedPrincipal
            Effect: Allow
            Principal: '*'
            Action: vpc-lattice-svcs:Invoke
            Resource: '*'
            Condition:
              StringNotEqualsIgnoreCase:
                aws:PrincipalType: anonymous

  BackendsServiceNetwork:
    Type: AWS::VpcLattice::ServiceNetwork
    Properties:
      Name: !Sub service-network-backends-${Identifier}
      AuthType: AWS_IAM

  # Only requests from the gateway VPC. The gateway's requests are not signed, so this network can't require
  # authentication: it authorizes the gateway by the VPC its requests come from (backends.yaml)
  BackendsServiceNetworkAuthPolicy:
    Type: AWS::VpcLattice::AuthPolicy
    Properties:
      ResourceIdentifier: !Ref BackendsServiceNetwork
      Policy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowGatewayVpc
            Effect: Allow
            Principal: '*'
            Action: vpc-lattice-svcs:Invoke
            Resource: '*'
            Condition:
              StringEquals:
                vpc-lattice-svcs:SourceVpc: !Ref GatewayVPC

  # ---------- ACCESS LOGGING (ONE LOG GROUP PER SERVICE NETWORK) ----------
  'Fn::ForEach::Networks':
    - Network
    - [Agents, Backends]
    - '${Network}AccessLogGroup':
        Type: AWS::Logs::LogGroup
        Properties:
          LogGroupName: !Join ['', ['/aws/vpclattice/', !FindInMap [NetworkNames, !Ref Network, Name], '-', !Ref Identifier]]
          RetentionInDays: 7

  # Requests to the VPC Lattice services (caller principal, auth decision, path, status code) and connections to the
  # resource configurations (the central AWS endpoints). Chained with DependsOn: the subscriptions update the same
  # CloudWatch Logs resource policy.
  AgentsServicesAccessLogSubscription:
    Type: AWS::VpcLattice::AccessLogSubscription
    Properties:
      ResourceIdentifier: !Ref AgentsServiceNetwork
      DestinationArn: !GetAtt AgentsAccessLogGroup.Arn
      ServiceNetworkLogType: SERVICE

  AgentsResourcesAccessLogSubscription:
    Type: AWS::VpcLattice::AccessLogSubscription
    DependsOn: AgentsServicesAccessLogSubscription
    Properties:
      ResourceIdentifier: !Ref AgentsServiceNetwork
      DestinationArn: !GetAtt AgentsAccessLogGroup.Arn
      ServiceNetworkLogType: RESOURCE

  BackendsServicesAccessLogSubscription:
    Type: AWS::VpcLattice::AccessLogSubscription
    DependsOn: AgentsResourcesAccessLogSubscription
    Properties:
      ResourceIdentifier: !Ref BackendsServiceNetwork
      DestinationArn: !GetAtt BackendsAccessLogGroup.Arn
      ServiceNetworkLogType: SERVICE

  BackendsResourcesAccessLogSubscription:
    Type: AWS::VpcLattice::AccessLogSubscription
    DependsOn: BackendsServicesAccessLogSubscription
    Properties:
      ResourceIdentifier: !Ref BackendsServiceNetwork
      DestinationArn: !GetAtt BackendsAccessLogGroup.Arn
      ServiceNetworkLogType: RESOURCE

  # ========== CENTRAL AWS SERVICE ENDPOINTS ==========
  # ---------- ENDPOINTS VPC ----------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub endpoints-vpc-${AWS::StackName}

  # For::Each iteration: per subnet type (RGW, Endpoints) and AZ (2 AZs)
  'Fn::ForEach::SubnetTypes':
    - SubnetType
    - [RGW, Endpoints]
    - '${SubnetType}':
      'Fn::ForEach::AZ':
        - AvailabilityZone
        - [a, b]
        - '${SubnetType}Subnet${AvailabilityZone}':
            Type: AWS::EC2::Subnet
            Properties:
              VpcId: !Ref VPC
              AvailabilityZone: !Select
                - !FindInMap [AzToIndex, !Ref AvailabilityZone, Index]
                - !GetAZs ''
              CidrBlock: !Select
                - !FindInMap [SubnetToIndex, !Sub "${SubnetType}${AvailabilityZone}", Index]
                - !Cidr [!GetAtt VPC.CidrBlock, 256, 8]
              Tags:
                - Key: Name
                  Value: !Sub endpoints-subnet-${SubnetType}-AZ${AvailabilityZone}-${AWS::StackName}
          '${SubnetType}RouteTable${AvailabilityZone}':
            Type: AWS::EC2::RouteTable
            Properties:
              VpcId: !Ref VPC
              Tags:
                - Key: Name
                  Value: !Sub endpoints-rt-${SubnetType}-AZ${AvailabilityZone}-${AWS::StackName}
          '${SubnetType}RouteTableAssociation${AvailabilityZone}':
            Type: AWS::EC2::SubnetRouteTableAssociation
            Properties:
              RouteTableId: !Ref
                'Fn::Sub': '${SubnetType}RouteTable${AvailabilityZone}'
              SubnetId: !Ref
                'Fn::Sub': '${SubnetType}Subnet${AvailabilityZone}'

  # ---------- SECURITY GROUPS ----------
  RGWSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Resource Gateway Security Group
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - Description: Allowing HTTPS to the VPC endpoints (local VPC)
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !GetAtt VPC.CidrBlock
      Tags:
        - Key: Name
          Value: !Sub endpoints-vpc-resource-gateway-security-group-${AWS::StackName}

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VPC Endpoints Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: Allowing HTTPS from the resource gateway
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref RGWSecurityGroup
      SecurityGroupEgress:
        - Description: Allowing egress traffic (local VPC)
          IpProtocol: "-1"
          CidrIp: !GetAtt VPC.CidrBlock
      Tags:
        - Key: Name
          Value: !Sub endpoints-vpc-endpoint-security-group-${AWS::StackName}

  # ---------- RESOURCE GATEWAY ----------
  ResourceGateway:
    Type: AWS::VpcLattice::ResourceGateway
    Properties:
      Name: !Sub resource-gateway-${Identifier}
      IpAddressType: IPV4
      ResourceConfigDnsResolution: IN_VPC
      SecurityGroupIds:
        - !Ref RGWSecurityGroup
      SubnetIds:
        - !Ref RGWSubneta
        - !Ref RGWSubnetb
      VpcIdentifier: !Ref VPC

  # ---------- VPC ENDPOINTS & RESOURCE CONFIGURATIONS ----------
  # Per endpoint: 1 interface VPC endpoint (private DNS on) and 1 single resource configuration whose custom domain
  # name is the service's standard DNS name.
  'Fn::ForEach::Endpoints':
    - EndpointKey
    - [bedrock, registry, ecrapi, logs, sts, secrets, ssmmsgs]
    - '${EndpointKey}Endpoint':
        Type: AWS::EC2::VPCEndpoint
        Properties:
          VpcEndpointType: Interface
          VpcId: !Ref VPC
          ServiceName: !Join ['.', ['com.amazonaws', !Ref AWS::Region, !FindInMap [Endpoints, !Ref EndpointKey, Service]]]
          PrivateDnsEnabled: true
          SecurityGroupIds:
            - !Ref EndpointSecurityGroup
          SubnetIds:
            - !Ref EndpointsSubneta
            - !Ref EndpointsSubnetb
      '${EndpointKey}ResourceConfiguration':
        Type: AWS::VpcLattice::ResourceConfiguration
        DependsOn: !Sub '${EndpointKey}Endpoint'
        Properties:
          Name: !Sub 'resource-config-${EndpointKey}-${Identifier}'
          ResourceConfigurationType: SINGLE
          ResourceGatewayId: !Ref ResourceGateway
          ProtocolType: TCP
          PortRanges:
            - '443'
          CustomDomainName: !Join ['.', [!FindInMap [Endpoints, !Ref EndpointKey, Prefix], !Ref AWS::Region, !FindInMap [Endpoints, !Ref EndpointKey, Suffix]]]
          ResourceConfigurationDefinition:
            DnsResource:
              DomainName: !Join ['.', [!FindInMap [Endpoints, !Ref EndpointKey, Prefix], !Ref AWS::Region, !FindInMap [Endpoints, !Ref EndpointKey, Suffix]]]
              IpAddressType: IPV4

  # Amazon ECR registry endpoint: its DNS name (<account>.dkr.ecr.<region>.amazonaws.com) contains the account ID
  ecrdkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      PrivateDnsEnabled: true
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      SubnetIds:
        - !Ref EndpointsSubneta
        - !Ref EndpointsSubnetb

  ecrdkrResourceConfiguration:
    Type: AWS::VpcLattice::ResourceConfiguration
    DependsOn: ecrdkrEndpoint
    Properties:
      Name: !Sub 'resource-config-ecrdkr-${Identifier}'
      ResourceConfigurationType: SINGLE
      ResourceGatewayId: !Ref ResourceGateway
      ProtocolType: TCP
      PortRanges:
        - '443'
      CustomDomainName: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
      ResourceConfigurationDefinition:
        DnsResource:
          DomainName: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          IpAddressType: IPV4

  # ---------- RESOURCE ASSOCIATIONS ----------
  # Each endpoint goes only into the service networks that use it. The model (bedrock) is only in 'backends', so every
  # model call goes through the gateway; the registry and ECS Exec (ssmmsgs) are only in 'agents'.
  'Fn::ForEach::AgentsEndpoints':
    - EndpointKey
    - [registry, ecrapi, ecrdkr, logs, sts, secrets, ssmmsgs]
    - 'Agents${EndpointKey}ResourceAssociation':
        Type: AWS::VpcLattice::ServiceNetworkResourceAssociation
        Properties:
          PrivateDnsEnabled: true
          ResourceConfigurationId: !GetAtt [!Sub '${EndpointKey}ResourceConfiguration', Id]
          ServiceNetworkId: !Ref AgentsServiceNetwork
          Tags:
            - Key: Name
              Value: !Sub resource-association-agents-${EndpointKey}-${Identifier}

  'Fn::ForEach::BackendsEndpoints':
    - EndpointKey
    - [bedrock, ecrapi, ecrdkr, logs, sts, secrets]
    - 'Backends${EndpointKey}ResourceAssociation':
        Type: AWS::VpcLattice::ServiceNetworkResourceAssociation
        Properties:
          PrivateDnsEnabled: true
          ResourceConfigurationId: !GetAtt [!Sub '${EndpointKey}ResourceConfiguration', Id]
          ServiceNetworkId: !Ref BackendsServiceNetwork
          Tags:
            - Key: Name
              Value: !Sub resource-association-backends-${EndpointKey}-${Identifier}

  # ========== GATEWAY VPC ==========
  # Created here, not in gateway.yaml: the 'backends' auth policies (this stack and backends.yaml) need its ID before
  # the gateway is deployed. The gateway tasks and their database are in gateway.yaml.
  GatewayVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub gateway-vpc-${AWS::StackName}

  'Fn::ForEach::GatewayAZ':
    - AvailabilityZone
    - [a, b]
    - 'GatewaySubnet${AvailabilityZone}':
        Type: AWS::EC2::Subnet
        Properties:
          VpcId: !Ref GatewayVPC
          AvailabilityZone: !Select
            - !FindInMap [AzToIndex, !Ref AvailabilityZone, Index]
            - !GetAZs ''
          CidrBlock: !Select
            - !FindInMap [AzToIndex, !Ref AvailabilityZone, Index]
            - !Cidr [!GetAtt GatewayVPC.CidrBlock, 256, 8]
          Tags:
            - Key: Name
              Value: !Sub gateway-subnet-workload-AZ${AvailabilityZone}-${AWS::StackName}
      'GatewayRouteTable${AvailabilityZone}':
        Type: AWS::EC2::RouteTable
        Properties:
          VpcId: !Ref GatewayVPC
          Tags:
            - Key: Name
              Value: !Sub gateway-rt-workload-AZ${AvailabilityZone}-${AWS::StackName}
      'GatewayRouteTableAssociation${AvailabilityZone}':
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
          RouteTableId: !Ref
            'Fn::Sub': 'GatewayRouteTable${AvailabilityZone}'
          SubnetId: !Ref
            'Fn::Sub': 'GatewaySubnet${AvailabilityZone}'

  # Amazon S3 gateway endpoint (Amazon ECR image layers)
  GatewayS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref GatewayVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds:
        - !Ref GatewayRouteTablea
        - !Ref GatewayRouteTableb

  # Its ingress rule (HTTPS from the LiteLLM tasks) is in gateway.yaml, with the tasks' security group
  GatewayVpcLatticeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VPC Lattice VPC association Security Group
      VpcId: !Ref GatewayVPC
      Tags:
        - Key: Name
          Value: !Sub gateway-vpc-vpclattice-security-group-${AWS::StackName}

  # The gateway reaches the backends (their custom domain names, gateway.yaml) and the central AWS endpoints (private DNS)
  GatewayVpcAssociation:
    Type: AWS::VpcLattice::ServiceNetworkVpcAssociation
    Properties:
      ServiceNetworkIdentifier: !Ref BackendsServiceNetwork
      VpcIdentifier: !Ref GatewayVPC
      SecurityGroupIds:
        - !Ref GatewayVpcLatticeSecurityGroup
      PrivateDnsEnabled: true
      DnsOptions:
        PrivateDnsPreference: SPECIFIED_DOMAINS_ONLY
        PrivateDnsSpecifiedDomains:
          - '*.amazonaws.com'

Outputs:
  AgentsServiceNetworkId:
    Description: The 'agents' VPC Lattice service network ID
    Value: !GetAtt AgentsServiceNetwork.Id
  AgentsServiceNetworkArn:
    Description: The 'agents' VPC Lattice service network ARN
    Value: !GetAtt AgentsServiceNetwork.Arn
  BackendsServiceNetworkId:
    Description: The 'backends' VPC Lattice service network ID
    Value: !GetAtt BackendsServiceNetwork.Id
  RegistryEndpointUrl:
    Description: URL of the AWS Agent Registry data plane through its centralized endpoint
    Value: !Sub https://agent-registry.${AWS::Region}.api.aws
  GatewayVpcId:
    Description: Gateway VPC ID (the backends authorize it as the source VPC)
    Value: !Ref GatewayVPC
  GatewayVpcLatticeSecurityGroupId:
    Description: Security group of the gateway VPC's association to 'backends'
    Value: !Ref GatewayVpcLatticeSecurityGroup
  GatewaySubnets:
    Description: Gateway VPC subnets (LiteLLM tasks and database)
    Value: !Join [',', [!Ref GatewaySubneta, !Ref GatewaySubnetb]]
