AWSTemplateFormatVersion: 2010-09-09
Description: AI gateway - LiteLLM on Amazon ECS in the gateway VPC, its Amazon RDS for PostgreSQL database, the private hosted zone for the backends' custom domain names, and the ai-gateway VPC Lattice service (in the 'agents' service network)
Transform: 'AWS::LanguageExtensions'

# The gateway is the only hop between the agents and the backends: the ai-gateway service is in the 'agents' service
# network, and the gateway VPC (central.yaml) joins the 'backends' service network. One virtual key per caller holds
# its model, tool and agent permissions and its budget; the database stores them.

Parameters:
  Identifier:
    Type: String
    Description: Short pattern identifier for VPC Lattice and database names
    Default: agentic-gateway
  AgentsServiceNetworkId:
    Type: String
    Description: The 'agents' VPC Lattice service network ID (the ai-gateway service joins it)
  GatewayVpcId:
    Type: String
    Description: Gateway VPC ID
  GatewaySubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Gateway VPC subnets (LiteLLM tasks and database)
  GatewayVpcLatticeSecurityGroupId:
    Type: String
    Description: Security group of the gateway VPC's association to 'backends' (allows the LiteLLM tasks)
  VpcLatticePrefixListId:
    Type: String
    Description: VPC Lattice managed prefix list ID (VPC Lattice reaches the LiteLLM tasks from it)
  HostedZoneName:
    Type: String
    Description: Domain of the services' custom domain names (for example, example.com gives ai-gateway.example.com)
  CertificateArn:
    Type: String
    Description: ARN of the ACM certificate for the ai-gateway HTTPS listener. It must cover *.<HostedZoneName>.
  ClusterName:
    Type: String
    Description: Amazon ECS cluster name
  ApplicationLogGroup:
    Type: String
    Description: Application log group
  TaskExecutionRoleArn:
    Type: String
    Description: ECS task execution role ARN (injects the gateway secrets)
  GatewayRoleArn:
    Type: String
    Description: AI gateway task role ARN
  EcsInfrastructureRoleArn:
    Type: String
    Description: ECS infrastructure role ARN (VPC Lattice target registration)
  GatewayImageUri:
    Type: String
    Description: AI gateway (LiteLLM) image URI (ARM64)
  AgentEcsRoleArn:
    Type: String
    Description: Self-hosted agent (agent-ecs) role ARN
  AgentRuntimeRoleArn:
    Type: String
    Description: AgentCore Runtime agent (agent-runtime) role ARN
  TriageRoleArn:
    Type: String
    Description: Triage agent role ARN (calls the gateway for its model)
  LiteLLMMasterKeyArn:
    Type: String
    Description: ARN of the LiteLLM master key secret
  AgentEcsKeyArn:
    Type: String
    Description: ARN of the agent-ecs virtual key secret
  AgentRuntimeKeyArn:
    Type: String
    Description: ARN of the agent-runtime virtual key secret
  AgentTriageKeyArn:
    Type: String
    Description: ARN of the triage agent's virtual key secret
  McpTicketsUrl:
    Type: String
    Description: MCP server URL (tickets), reached from the gateway VPC
  ApiDirectoryUrl:
    Type: String
    Description: REST API URL (directory), reached from the gateway VPC
  AgentTriageUrl:
    Type: String
    Description: A2A agent URL (triage), reached from the gateway VPC
  BackendDnsNames:
    Type: CommaDelimitedList
    Description: Backend services' DNS names (mcp-tickets, api-directory, agent-triage - in this order)
  BackendDnsHostedZoneIds:
    Type: CommaDelimitedList
    Description: Hosted zone IDs of the backend services' DNS names (same order)
  ModelId:
    Type: String
    Description: Amazon Bedrock model (or inference profile) ID the gateway serves as helpdesk-llm
    Default: eu.anthropic.claude-haiku-5-5

Mappings:
  Backends:
    McpTickets:
      Name: mcp-tickets
      Index: 0
    ApiDirectory:
      Name: api-directory
      Index: 1
    AgentTriage:
      Name: agent-triage
      Index: 2

Resources:
  # ---------- DNS RESOLUTION (BACKEND SERVICES, GATEWAY VPC) ----------
  # A and AAAA aliases to the DNS name VPC Lattice gives each backend service, so the gateway calls them by their
  # custom domain names
  GatewayVpcHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref HostedZoneName
      VPCs:
        - VPCId: !Ref GatewayVpcId
          VPCRegion: !Ref AWS::Region

  'Fn::ForEach::Backends':
    - Backend
    - [McpTickets, ApiDirectory, AgentTriage]
    - 'Fn::ForEach::RecordTypes':
        - RecordType
        - [A, AAAA]
        - '${Backend}${RecordType}':
            Type: AWS::Route53::RecordSet
            Properties:
              HostedZoneId: !Ref GatewayVpcHostedZone
              Name: !Join ['.', [!FindInMap [Backends, !Ref Backend, Name], !Ref HostedZoneName]]
              Type: !Ref RecordType
              AliasTarget:
                DNSName: !Select [!FindInMap [Backends, !Ref Backend, Index], !Ref BackendDnsNames]
                HostedZoneId: !Select [!FindInMap [Backends, !Ref Backend, Index], !Ref BackendDnsHostedZoneIds]
                EvaluateTargetHealth: false

  # ---------- SECURITY GROUPS (GATEWAY VPC) ----------
  GatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LiteLLM gateway tasks
      VpcId: !Ref GatewayVpcId
      SecurityGroupIngress:
        - Description: Allowing gateway traffic from VPC Lattice (ai-gateway target)
          IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourcePrefixListId: !Ref VpcLatticePrefixListId
      SecurityGroupEgress:
        - Description: Allowing HTTPS (backends, central endpoints and Amazon S3)
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub gateway-vpc-litellm-security-group-${AWS::StackName}

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LiteLLM database
      VpcId: !Ref GatewayVpcId
      SecurityGroupIngress:
        - Description: Allowing PostgreSQL from the gateway tasks
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref GatewaySecurityGroup
      Tags:
        - Key: Name
          Value: !Sub gateway-vpc-database-security-group-${AWS::StackName}

  # Gateway egress to the database (a separate resource, so the two security groups don't reference each other inline)
  GatewayToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref GatewaySecurityGroup
      Description: Allowing PostgreSQL to the database
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup

  # The gateway VPC's association to 'backends' (central.yaml) accepts HTTPS from the LiteLLM tasks
  GatewayVpcLatticeIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref GatewayVpcLatticeSecurityGroupId
      Description: Allowing HTTPS from the LiteLLM tasks
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref GatewaySecurityGroup

  # ---------- DATABASE (AMAZON RDS FOR POSTGRESQL) ----------
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub gateway-db-subnet-group-${Identifier}
      SubnetIds: !Ref GatewaySubnets

  # Small single-AZ instance for the demo. The master password is managed by AWS Secrets Manager
  # (ManageMasterUserPassword); LiteLLM reads it as DATABASE_PASSWORD from the managed secret's 'password' key.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    # checkov:skip=CKV_AWS_157:Single-AZ is deliberate for a short-lived demo database
    # checkov:skip=CKV2_AWS_30:Query logging is operational hardening out of scope for the demo database
    # checkov:skip=CKV2_AWS_60:Copy-tags-to-snapshots is irrelevant - the demo database is torn down
    # checkov:skip=CKV_AWS_161:IAM DB authentication off - the gateway connects using the Secrets Manager managed master password
    Properties:
      DBInstanceIdentifier: !Sub gateway-db-${Identifier}
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      DBName: litellm
      MasterUsername: litellm
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      StorageEncrypted: true

  # ---------- VPC LATTICE SERVICE (AI GATEWAY) ----------
  AiGatewayService:
    Type: AWS::VpcLattice::Service
    Properties:
      Name: !Sub service-ai-gateway-${Identifier}
      AuthType: AWS_IAM
      CustomDomainName: !Sub ai-gateway.${HostedZoneName}
      CertificateArn: !Ref CertificateArn

  # Only the two helpdesk agents and the triage agent may call the gateway; the gateway then applies each caller's
  # virtual key
  AiGatewayAuthPolicy:
    Type: AWS::VpcLattice::AuthPolicy
    Properties:
      ResourceIdentifier: !Ref AiGatewayService
      Policy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowGatewayCallers
            Effect: Allow
            Principal:
              AWS:
                - !Ref AgentEcsRoleArn
                - !Ref AgentRuntimeRoleArn
                - !Ref TriageRoleArn
            Action: vpc-lattice-svcs:Invoke
            Resource: !Sub '${AiGatewayService.Arn}/*'

  # The callers' IAM permission to invoke the ai-gateway service (the roles are in common.yaml)
  InvokeAiGatewayPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !Select [1, !Split ['/', !Ref AgentEcsRoleArn]]
        - !Select [1, !Split ['/', !Ref AgentRuntimeRoleArn]]
        - !Select [1, !Split ['/', !Ref TriageRoleArn]]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InvokeAiGateway
            Effect: Allow
            Action: vpc-lattice-svcs:Invoke
            Resource: !Sub '${AiGatewayService.Arn}/*'

  AiGatewayTargetGroup:
    Type: AWS::VpcLattice::TargetGroup
    Properties:
      Name: !Sub target-group-ai-gateway-${Identifier}
      Type: IP
      Config:
        Port: 4000
        Protocol: HTTP
        ProtocolVersion: HTTP1
        IpAddressType: IPV4
        VpcIdentifier: !Ref GatewayVpcId
        HealthCheck:
          Enabled: true
          Path: /health/liveliness
          Protocol: HTTP

  AiGatewayListener:
    Type: AWS::VpcLattice::Listener
    Properties:
      Name: https-listener
      Protocol: HTTPS
      Port: 443
      ServiceIdentifier: !Ref AiGatewayService
      DefaultAction:
        Forward:
          TargetGroups:
            - TargetGroupIdentifier: !Ref AiGatewayTargetGroup
              Weight: 100

  AiGatewayServiceAssociation:
    Type: AWS::VpcLattice::ServiceNetworkServiceAssociation
    Properties:
      ServiceIdentifier: !Ref AiGatewayService
      ServiceNetworkIdentifier: !Ref AgentsServiceNetworkId

  # ---------- LITELLM (AMAZON ECS) ----------
  GatewayTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub gateway-${AWS::StackName}
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref GatewayRoleArn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ContainerDefinitions:
        - Name: gateway
          Image: !Ref GatewayImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
              Name: litellm
          # TCP keepalives below the VPC Lattice idle timeouts, so pooled connections to the backends and to the
          # centralized bedrock-runtime endpoint stay open between requests
          SystemControls:
            - Namespace: net.ipv4.tcp_keepalive_time
              Value: '60'
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: MODEL_ID
              Value: !Ref ModelId
            # The backends the gateway exposes (gateway configuration, not the agents')
            - Name: TICKETS_URL
              Value: !Ref McpTicketsUrl
            - Name: DIRECTORY_URL
              Value: !Ref ApiDirectoryUrl
            - Name: TRIAGE_URL
              Value: !Sub '${AgentTriageUrl}/'
            - Name: DATABASE_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DATABASE_NAME
              Value: litellm
            - Name: DATABASE_USERNAME
              Value: litellm
          Secrets:
            - Name: LITELLM_MASTER_KEY
              ValueFrom: !Ref LiteLLMMasterKeyArn
            - Name: AGENT_ECS_KEY
              ValueFrom: !Ref AgentEcsKeyArn
            - Name: AGENT_RUNTIME_KEY
              ValueFrom: !Ref AgentRuntimeKeyArn
            - Name: AGENT_TRIAGE_KEY
              ValueFrom: !Ref AgentTriageKeyArn
            - Name: DATABASE_PASSWORD
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway

  GatewayService:
    Type: AWS::ECS::Service
    DependsOn:
      - Database
      - GatewayVpcLatticeIngress
      - McpTicketsA
      - ApiDirectoryA
      - AgentTriageA
    Properties:
      ServiceName: !Sub gateway-${AWS::StackName}
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref GatewayTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref GatewaySecurityGroup
          Subnets: !Ref GatewaySubnets
      VpcLatticeConfigurations:
        - RoleArn: !Ref EcsInfrastructureRoleArn
          TargetGroupArn: !GetAtt AiGatewayTargetGroup.Arn
          PortName: litellm

Outputs:
  AiGatewayServiceArn:
    Description: ai-gateway service ARN (the Makefile reads its DNS name on the service network endpoint)
    Value: !GetAtt AiGatewayService.Arn
  # DNS name VPC Lattice gives the ai-gateway service, and its hosted zone (aliases in dns.yaml)
  AiGatewayDnsName:
    Description: ai-gateway service DNS name
    Value: !GetAtt AiGatewayService.DnsEntry.DomainName
  AiGatewayDnsHostedZoneId:
    Description: Hosted zone ID of the ai-gateway service DNS name
    Value: !GetAtt AiGatewayService.DnsEntry.HostedZoneId
