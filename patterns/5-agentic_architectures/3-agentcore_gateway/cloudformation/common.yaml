AWSTemplateFormatVersion: 2010-09-09
Description: Common items - Amazon ECR repositories, S3 bucket for packaged Lambda code, Amazon ECS cluster, application log group and IAM roles (including the AgentCore Gateway service role)

Parameters:
  Identifier:
    Type: String
    Description: Short pattern identifier (the gateway, its policy engine and the directory function are named after it)
    Default: agentic-core

Resources:
  # ========== CONTAINERS: IMAGES, CLUSTER AND LOGS ==========
  # ---------- AMAZON ECR REPOSITORIES ----------
  AgentRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: !Sub 'agent-${AWS::StackName}'
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true

  TriageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: !Sub 'triage-${AWS::StackName}'
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true

  TicketsRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: !Sub 'tickets-${AWS::StackName}'
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true

  # ---------- ARTIFACTS BUCKET (aws cloudformation package) ----------
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    # checkov:skip=CKV_AWS_18:Short-lived bucket holding packaged demo Lambda code, access logging not needed
    # checkov:skip=CKV_AWS_21:Packaged artifacts are re-uploaded on every deploy, versioning not needed
    DeletionPolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------- AMAZON ECS CLUSTER AND APPLICATION LOGS ----------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub cluster-${AWS::StackName}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # Application logs (agent-ecs, tickets and triage)
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${AWS::StackName}/applications
      RetentionInDays: 7

  # ========== IAM ==========
  # ---------- AMAZON ECS TASK EXECUTION ROLE ----------
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ---------- POLICY (RE-USED BY THE ROLES THAT CALL THE GATEWAY) ----------
  GatewayConsumerPermissions:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DiscoverRegistryRecords
            Effect: Allow
            Action:
              - agent-registry:SearchDiscoverableRegistryRecords
              - agent-registry:ListDiscoverableRegistryRecords
              - agent-registry:GetDiscoverableRegistryRecord
            Resource: !Sub arn:${AWS::Partition}:agent-registry:${AWS::Region}:${AWS::AccountId}:registry/*

  # ---------- SELF-HOSTED AGENT (ECS TASK ROLE) ----------
  AgentEcsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub agent-ecs-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref GatewayConsumerPermissions
      Policies:
        # ECS Exec (the tests run commands inside the agent container)
        - PolicyName: ecs-exec
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  # ---------- AGENT ON AGENTCORE RUNTIME ----------
  AgentRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub agent-runtime-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      ManagedPolicyArns:
        - !Ref GatewayConsumerPermissions
      # AgentCore Runtime pulls the agent image and writes its logs with the agent's role
      Policies:
        - PolicyName: runtime-platform
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PullImage
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt AgentRepository.Arn
              - Sid: EcrToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*

  # ---------- TRIAGE AGENT (ECS TASK ROLE) ----------
  # A backend for the helpdesk agents, and a consumer of the gateway for its own model calls
  TriageRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub triage-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref GatewayConsumerPermissions

  # ---------- AGENTCORE GATEWAY (SERVICE ROLE) ----------
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub gateway-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: gateway-targets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeDirectory
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:api-directory-${Identifier}
              - Sid: InvokeModels
                Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - bedrock-mantle:GetModel
                  - bedrock-mantle:ListModels
                Resource: !Sub arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/*
              # The gateway evaluates its policy engine on every request
              - Sid: ReadPolicyEngine
                Effect: Allow
                Action: bedrock-agentcore:GetPolicyEngine
                Resource: !Sub
                  - arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:policy-engine/policy_engine_${Name}-*
                  - Name: !Join ['_', !Split ['-', !Ref Identifier]]
              - Sid: AuthorizeWithPolicyEngine
                Effect: Allow
                Action:
                  - bedrock-agentcore:AuthorizeAction
                  - bedrock-agentcore:PartiallyAuthorizeActions
                Resource:
                  - !Sub
                    - arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:policy-engine/policy_engine_${Name}-*
                    - Name: !Join ['_', !Split ['-', !Ref Identifier]]
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/gateway-${Identifier}-*

  # ---------- LAMBDA FUNCTION (REST API) ----------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

Outputs:
  AgentRepositoryUri:
    Description: Agent image repository URI
    Value: !GetAtt AgentRepository.RepositoryUri
  TriageRepositoryUri:
    Description: Triage agent image repository URI
    Value: !GetAtt TriageRepository.RepositoryUri
  TicketsRepositoryUri:
    Description: Tickets MCP server image repository URI
    Value: !GetAtt TicketsRepository.RepositoryUri
  ArtifactsBucket:
    Description: S3 bucket used by aws cloudformation package (empty it before deleting the stack)
    Value: !Ref ArtifactsBucket
  ClusterName:
    Description: Amazon ECS cluster name
    Value: !Ref Cluster
  ApplicationLogGroup:
    Description: Application log group (agent-ecs, tickets and triage)
    Value: !Ref ApplicationLogGroup
  TaskExecutionRoleArn:
    Description: ECS task execution role ARN
    Value: !GetAtt TaskExecutionRole.Arn
  AgentEcsRoleArn:
    Description: Self-hosted agent (agent-ecs) task role ARN
    Value: !GetAtt AgentEcsRole.Arn
  AgentRuntimeRoleArn:
    Description: AgentCore Runtime agent (agent-runtime) execution role ARN
    Value: !GetAtt AgentRuntimeRole.Arn
  TriageRoleArn:
    Description: Triage agent task role ARN
    Value: !GetAtt TriageRole.Arn
  GatewayRoleArn:
    Description: AgentCore Gateway service role ARN
    Value: !GetAtt GatewayRole.Arn
  LambdaRoleArn:
    Description: Lambda execution role ARN
    Value: !GetAtt LambdaRole.Arn
